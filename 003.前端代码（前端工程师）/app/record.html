<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>简记 · 记一笔</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/base.css">
</head>
<body class="bg-plane text-text-primary min-h-screen flex flex-col font-body-md text-body-md">

  <!-- 记一笔副页：独立表单页（不带主导航），支持支出 / 收入 -->
  <main class="w-full flex-1 flex flex-col">
    <div class="max-w-[520px] w-full mx-auto px-margin md:px-margin-desktop py-space-lg flex flex-col gap-space-lg pb-28">

      <!-- 页头：返回 + 标题 -->
      <div class="flex items-center justify-between">
        <button class="icon-btn" id="btn-back" aria-label="返回" type="button">
          <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        </button>
        <h1 class="font-headline-md text-headline-md text-text-primary tracking-tight">记一笔</h1>
        <span class="w-9"></span>
      </div>

      <!-- 收支类型：默认支出 -->
      <div class="flex items-center justify-center">
        <div class="seg" id="type-seg">
          <button class="on" data-type="expense">支出</button>
          <button data-type="income">收入</button>
        </div>
      </div>

      <!-- 金额 -->
      <div class="p-space-lg rounded-[16px] bg-surface-hero flex flex-col gap-space-xs">
        <label class="font-caption text-caption text-text-secondary" for="amt">金额 (CNY)</label>
        <div class="flex items-baseline gap-space-xs">
          <span class="font-headline-lg text-headline-lg text-primary" id="amt-sign">-¥</span>
          <input class="w-full bg-transparent font-display-hero text-display-hero text-text-primary font-semibold outline-none border-b border-primary/20 focus:border-primary transition-colors pb-1" id="amt" inputmode="decimal" placeholder="0.00" type="text">
        </div>
        <p class="font-caption text-caption text-text-muted" id="amt-hint">支持算式，如 12+16 或 58/2</p>
      </div>

      <!-- 分类宫格（按收支类型联动） -->
      <div>
        <div class="flex items-center justify-between px-space-xs pb-space-xs">
          <span class="font-label-sm text-label-sm text-text-primary">选择分类</span>
          <span class="font-caption text-caption text-text-muted" id="cat-hint">—</span>
        </div>
        <div class="grid grid-cols-3 gap-space-xs" id="cat-grid" role="radiogroup" aria-label="选择分类"></div>
      </div>

      <!-- 二级分类 -->
      <div class="flex flex-wrap gap-space-xs" id="sub-row"></div>

      <!-- 日期与账户 -->
      <div class="grid grid-cols-2 gap-space-md">
        <label class="flex flex-col gap-space-2xs text-[13px] text-text-secondary">
          记账日期
          <input class="h-11 px-space-sm rounded-xl bg-surface-container-low text-text-primary font-body-md text-body-md outline-none focus:bg-surface-container transition-colors" id="dt" type="date">
        </label>
        <label class="flex flex-col gap-space-2xs text-[13px] text-text-secondary">
          资金账户
          <select class="h-11 px-space-sm rounded-xl bg-surface-container-low text-text-primary font-body-md text-body-md outline-none cursor-pointer" id="acct"></select>
        </label>
      </div>

      <!-- 备注 -->
      <label class="flex flex-col gap-space-2xs text-[13px] text-text-secondary">
        备注（选填，50 字内）
        <input class="h-11 px-space-sm rounded-xl bg-surface-container-low text-text-primary font-body-md text-body-md outline-none placeholder:text-text-muted focus:bg-surface-container transition-colors" id="note" maxlength="50" placeholder="例如：和府捞面园区店">
      </label>
    </div>

    <!-- 底部保存条 -->
    <div class="fixed bottom-0 left-0 right-0 z-40 bg-surface/90 backdrop-blur-xl border-t border-border-hairline">
      <div class="max-w-[520px] mx-auto px-margin md:px-margin-desktop py-space-md">
        <button class="w-full h-[52px] rounded-full bg-surface-variant hover:bg-surface-hero text-cta-label font-headline-md text-label-md flex items-center justify-center gap-space-xs shadow-[0_2px_8px_rgba(61,34,48,0.06)] active:scale-95 transition-all" id="btn-save" type="button">
          <span>保存</span>
          <span>🌸</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 transform translate-y-8 opacity-0 pointer-events-none transition-all duration-300 px-space-lg py-space-sm rounded-full bg-inverse-surface text-inverse-on-surface shadow-[0_12px_32px_-4px_rgba(61,34,48,0.2)] flex items-center gap-space-xs font-label-sm text-label-sm" id="toast-message">
    <span class="material-symbols-outlined text-primary-fixed text-[18px]" id="toast-icon">check_circle</span>
    <span id="toast-text">操作已完成</span>
  </div>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/categories.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/pages/record.js"></script>
</body>
</html>
