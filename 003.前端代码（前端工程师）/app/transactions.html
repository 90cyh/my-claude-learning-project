<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>简记 · 明细</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/css/base.css">
</head>
<body data-page="ledger-records" class="bg-plane text-text-primary min-h-screen flex flex-col font-body-md text-body-md">

  <!-- 页头 / 底部导航 / 页脚由 assets/js/shell.js 注入（含会话门禁） -->

  <main class="w-full pt-14 flex-1 pb-24">
    <div class="w-full max-w-7xl mx-auto px-margin md:px-margin-desktop py-space-lg flex flex-col gap-space-lg">
      <!-- Top Filter & Action Bar -->
      <section class="bg-surface rounded-xl p-space-md shadow-sm flex flex-col gap-space-md">
        <div class="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-space-md">
          <!-- Left: Month picker & Quick Navigation -->
          <div class="flex items-center gap-space-sm flex-wrap sm:flex-nowrap">
            <div class="relative">
            <div class="flex items-center bg-surface-container-low px-space-sm py-space-xs rounded-full">
              <button aria-label="上一月" class="w-7 h-7 rounded-full flex items-center justify-center text-text-secondary hover:bg-surface-hero hover:text-primary transition-colors" id="month-prev" type="button">
                <span class="material-symbols-outlined text-[18px]">chevron_left</span>
              </button>
              <div class="flex items-center gap-space-xs px-space-xs cursor-pointer group" id="month-toggle">
                <span class="material-symbols-outlined text-primary text-[18px]">calendar_today</span>
                <span class="font-headline-md text-headline-md text-text-primary tracking-tight" id="month-label">2026年 11月</span>
                <span class="material-symbols-outlined text-text-muted text-[16px] group-hover:translate-y-0.5 transition-transform">expand_more</span>
              </div>
              <button aria-label="下一月" class="w-7 h-7 rounded-full flex items-center justify-center text-text-secondary hover:bg-surface-hero hover:text-primary transition-colors" id="month-next" type="button">
                <span class="material-symbols-outlined text-[18px]">chevron_right</span>
              </button>
            </div>
            <!-- 月份下拉（复用头像菜单的下拉样式） -->
            <div class="hidden absolute left-0 top-12 w-44 max-h-80 overflow-y-auto bg-surface border border-border-hairline rounded-[14px] shadow-[0_12px_32px_-4px_rgba(61,34,48,0.12)] py-space-xs z-50" id="month-menu"></div>
            </div>
            <div class="hidden sm:flex items-center gap-space-xs text-text-muted font-caption text-caption px-space-xs">
              <span>共 <strong class="text-text-primary font-label-md text-label-md" id="stat-count">0</strong> 笔明细</span>
              <span>·</span>
              <span class="text-flow-expense font-label-sm text-label-sm">支 ¥<span id="stat-expense">0.00</span></span>
              <span>·</span>
              <span class="text-flow-income font-label-sm text-label-sm">收 ¥<span id="stat-income">0.00</span></span>
            </div>
          </div>
          <!-- Right: Actions Group -->
          <div class="flex items-center gap-space-sm self-end lg:self-auto">
            <button class="h-10 px-space-md rounded-full bg-surface-container-low hover:bg-surface-container text-text-secondary hover:text-text-primary font-label-md text-label-md flex items-center gap-space-xs transition-colors" id="exportBtn" type="button">
              <span class="material-symbols-outlined text-[18px]">ios_share</span>
              <span>导出 CSV</span>
            </button>
            <button class="h-10 px-space-lg rounded-full bg-surface-variant hover:bg-surface-hero text-cta-label font-label-md text-label-md flex items-center gap-space-xs shadow-[0_2px_8px_rgba(61,34,48,0.06)] active:scale-95 transition-all" id="quickAddBtn" type="button">
              <span class="text-[14px]">🌸</span>
              <span>记一笔</span>
            </button>
          </div>
        </div>
        <!-- Filters & Search Line -->
        <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-space-sm">
          <div class="flex items-center gap-space-xs overflow-x-auto pb-1 md:pb-0 -mx-space-xs px-space-xs">
            <button class="filter-chip active flex-shrink-0 h-8 px-space-md rounded-full bg-primary text-on-primary font-label-sm text-label-sm transition-colors flex items-center gap-space-2xs" data-filter="all" type="button">
              <span>全部类型</span>
            </button>
            <button class="filter-chip flex-shrink-0 h-8 px-space-md rounded-full bg-surface-container-low text-text-secondary hover:bg-surface-hero hover:text-primary font-label-sm text-label-sm transition-colors flex items-center gap-space-2xs" data-filter="expense" type="button">
              <span class="w-1.5 h-1.5 rounded-full bg-flow-expense"></span>
              <span>支出</span>
            </button>
            <button class="filter-chip flex-shrink-0 h-8 px-space-md rounded-full bg-surface-container-low text-text-secondary hover:bg-surface-hero hover:text-primary font-label-sm text-label-sm transition-colors flex items-center gap-space-2xs" data-filter="income" type="button">
              <span class="w-1.5 h-1.5 rounded-full bg-flow-income"></span>
              <span>收入</span>
            </button>
            <div class="w-px h-4 bg-outline-variant/30 mx-space-2xs flex-shrink-0"></div>
            <button class="filter-chip flex-shrink-0 h-8 px-space-md rounded-full bg-surface-container-low text-text-secondary hover:bg-surface-hero hover:text-primary font-label-sm text-label-sm transition-colors" data-cat="餐饮" type="button">餐饮外卖</button>
            <button class="filter-chip flex-shrink-0 h-8 px-space-md rounded-full bg-surface-container-low text-text-secondary hover:bg-surface-hero hover:text-primary font-label-sm text-label-sm transition-colors" data-cat="购物" type="button">日用数码</button>
            <button class="filter-chip flex-shrink-0 h-8 px-space-md rounded-full bg-surface-container-low text-text-secondary hover:bg-surface-hero hover:text-primary font-label-sm text-label-sm transition-colors" data-cat="交通" type="button">交通出行</button>
            <button class="filter-chip flex-shrink-0 h-8 px-space-md rounded-full bg-surface-container-low text-text-secondary hover:bg-surface-hero hover:text-primary font-label-sm text-label-sm transition-colors" data-cat="娱乐" type="button">文娱活动</button>
          </div>
          <!-- Search Bar -->
          <div class="relative w-full md:w-72 flex-shrink-0">
            <span class="material-symbols-outlined absolute left-space-sm top-1/2 -translate-y-1/2 text-text-muted text-[18px]">search</span>
            <input class="w-full h-9 pl-9 pr-space-md rounded-full bg-surface-container-low text-text-primary placeholder:text-text-muted font-body-sm text-body-sm outline-none focus:bg-surface-container-lowest transition-colors" id="transactionSearch" placeholder="搜索备注、商家或标签..." type="text">
          </div>
        </div>
      </section>
      <!-- Main Responsive Two-Column System -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-space-lg items-start">
        <!-- Left Column (8 cols): Transaction Timeline & Records -->
        <section class="lg:col-span-8 flex flex-col gap-space-lg">
          <!-- 流水列表：由 assets/js/pages/transactions.js 按数据库实时渲染（按天分组） -->
          <div id="txn-groups" class="flex flex-col gap-space-lg"></div>
        </section>
        <!-- Right Column (4 cols): Sticky Quick Edit Panel (Desktop) -->
        <aside class="hidden lg:flex lg:col-span-4 flex-col gap-space-lg sticky top-20" id="sideEditorContainer">
          <div class="bg-surface rounded-xl p-space-md shadow-sm flex flex-col gap-space-md">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-space-xs">
                <span class="text-primary text-[18px]">🌸</span>
                <h2 class="font-headline-md text-headline-md text-text-primary">流水详情与快编</h2>
              </div>
              <span class="font-caption text-caption text-text-muted px-space-xs py-space-2xs rounded bg-surface-container">已自动暂存</span>
            </div>
            <div class="p-space-md rounded-xl bg-surface-hero flex flex-col gap-space-xs">
              <label class="font-caption text-caption text-text-secondary">交易金额 (CNY)</label>
              <div class="flex items-baseline gap-space-xs">
                <span class="font-headline-lg text-headline-lg text-primary">-¥</span>
                <input class="w-full bg-transparent font-display-hero text-headline-lg md:text-[32px] text-text-primary font-semibold outline-none border-b border-primary/20 focus:border-primary transition-colors pb-1" id="editAmountInput" step="0.01" type="number" value="28.00">
              </div>
            </div>
            <div class="flex flex-col gap-space-sm">
              <div class="flex flex-col gap-space-2xs">
                <label class="font-caption text-caption text-text-secondary">交易名称 / 摘要</label>
                <input class="h-10 px-space-sm rounded-lg bg-surface-container-low text-text-primary font-body-sm text-body-sm outline-none focus:bg-surface-container transition-colors" id="editTitleInput" type="text" value="精品手冲咖啡">
              </div>
              <div class="grid grid-cols-2 gap-space-sm">
                <div class="flex flex-col gap-space-2xs">
                  <label class="font-caption text-caption text-text-secondary">收支类别</label>
                  <select class="h-10 px-space-sm rounded-lg bg-surface-container-low text-text-primary font-body-sm text-body-sm outline-none cursor-pointer" id="editCategorySelect">
                    <option selected="" value="cat-dining">🍽️ 餐饮消费</option>
                    <option value="cat-transport">🚌 交通出行</option>
                    <option value="cat-shopping">🛍️ 生活日用</option>
                    <option value="cat-entertainment">🍿 文娱数码</option>
                    <option value="cat-medical">🌿 健康医疗</option>
                    <option value="flow-income">💰 工资及收益</option>
                  </select>
                </div>
                <div class="flex flex-col gap-space-2xs">
                  <label class="font-caption text-caption text-text-secondary">支付账户</label>
                  <select class="h-10 px-space-sm rounded-lg bg-surface-container-low text-text-primary font-body-sm text-body-sm outline-none cursor-pointer" id="editAccountSelect">
                    <option selected="" value="微信零钱">微信零钱</option>
                    <option value="支付宝余额">支付宝余额</option>
                    <option value="招商信用卡">招商信用卡</option>
                    <option value="现金钱包">现金钱包</option>
                  </select>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-space-sm">
                <div class="flex flex-col gap-space-2xs">
                  <label class="font-caption text-caption text-text-secondary">记账日期</label>
                  <input class="h-10 px-space-sm rounded-lg bg-surface-container-low text-text-primary font-body-sm text-body-sm outline-none cursor-pointer" id="editDateInput" title="默认由后台系统填入今天，可修改以补记过去 365 天内的账" type="date" value="2026-11-05">
                </div>
                <div class="flex flex-col gap-space-2xs">
                  <label class="font-caption text-caption text-text-secondary">发生时刻</label>
                  <input class="h-10 px-space-sm rounded-lg bg-surface-container-low text-text-primary font-body-sm text-body-sm outline-none cursor-pointer" id="editTimeInput" readonly title="由后台系统自动记录，不可手动修改" type="time" value="14:25">
                </div>
              </div>
              <div class="flex flex-col gap-space-2xs">
                <label class="font-caption text-caption text-text-secondary">商户与备注</label>
                <textarea class="p-space-sm rounded-lg bg-surface-container-low text-text-primary font-body-sm text-body-sm outline-none focus:bg-surface-container transition-colors resize-none" id="editRemarkInput" rows="2">星巴克日落大道烘焙工坊</textarea>
              </div>
            </div>
            <div class="flex items-center gap-space-sm pt-space-xs">
              <button class="flex-1 h-10 rounded-full bg-primary hover:bg-secondary text-on-primary font-label-md text-label-md flex items-center justify-center gap-space-xs transition-colors" id="saveTxBtn" type="button">
                <span class="material-symbols-outlined text-[18px]">check</span>
                <span>保存更新</span>
              </button>
              <button class="h-10 px-space-md rounded-full bg-surface-container-low hover:bg-surface-container text-text-muted hover:text-status-danger font-label-md text-label-md flex items-center justify-center transition-colors" id="deleteTxBtn" title="删除本笔明细" type="button">
                <span class="material-symbols-outlined text-[18px]">delete</span>
              </button>
            </div>
          </div>
          <!-- Month Budget Mini Status Card 已按需求移除（PRD：预算属 V1.1，且首页已有总预算展示） -->
        </aside>
      </div>
    </div>
    <!-- Mobile Floating Quick-Add Button (Visible only on <lg) -->
    <div class="lg:hidden fixed right-margin bottom-20 z-40">
      <button class="w-14 h-14 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg active:scale-95 transition-transform" id="mobileAddFab" type="button">
        <span class="material-symbols-outlined text-[26px]">add</span>
      </button>
    </div>
    <!-- Mobile Transaction Quick-Edit Bottom Drawer -->
    <div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-50 hidden transition-opacity" id="mobileDrawerOverlay">
      <div class="absolute bottom-0 left-0 right-0 max-h-[870px] overflow-y-auto bg-surface rounded-t-2xl p-space-lg flex flex-col gap-space-md shadow-2xl transform translate-y-full transition-transform duration-300" id="mobileDrawerPanel">
        <div class="w-12 h-1 rounded-full bg-surface-container mx-auto mb-space-xs"></div>
        <div class="flex items-center justify-between">
          <h3 class="font-headline-md text-headline-md text-text-primary">编辑流水</h3>
          <button class="w-8 h-8 rounded-full flex items-center justify-center text-text-muted hover:bg-surface-container-low" id="closeDrawerBtn" type="button">
            <span class="material-symbols-outlined text-[20px]">close</span>
          </button>
        </div>
        <div class="p-space-md rounded-xl bg-surface-hero flex flex-col gap-space-xs">
          <label class="font-caption text-caption text-text-secondary">金额 (CNY)</label>
          <div class="flex items-baseline gap-space-xs">
            <span class="font-headline-lg text-headline-lg text-primary">-¥</span>
            <input class="w-full bg-transparent font-display-hero-mobile text-headline-lg text-text-primary font-semibold outline-none border-b border-primary/20 pb-1" id="drawerAmountInput" type="number" value="28.00">
          </div>
        </div>
        <div class="flex flex-col gap-space-sm">
          <div class="flex flex-col gap-space-2xs">
            <label class="font-caption text-caption text-text-secondary">项目名称</label>
            <input class="h-10 px-space-sm rounded-lg bg-surface-container-low text-text-primary font-body-sm text-body-sm outline-none" id="drawerTitleInput" type="text" value="精品手冲咖啡">
          </div>
          <div class="flex flex-col gap-space-2xs">
            <label class="font-caption text-caption text-text-secondary">分类标签</label>
            <input class="h-10 px-space-sm rounded-lg bg-surface-container-low text-text-primary font-body-sm text-body-sm outline-none" id="drawerCategoryInput" type="text" value="餐饮消费">
          </div>
        </div>
        <div class="flex items-center gap-space-sm pt-space-sm pb-space-lg">
          <button class="flex-1 h-11 rounded-full bg-primary text-on-primary font-label-md text-label-md flex items-center justify-center" id="drawerSaveBtn" type="button">完成修改</button>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/auth.js"></script>
  <script src="assets/js/categories.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/toast.js"></script>
  <script src="assets/js/pages/transactions.js"></script>
</body>
</html>
