<form class="flex flex-col gap-4" id="registerForm" onsubmit="event.preventDefault(); handleRegister();">

<div class="relative flex items-center group">

<div class="flex justify-between items-center px-0.5">

<span class="text-[#9d8392] text-[11px]">建议 6~64 位字符，请牢记密码</span>
</div>
<div class="relative flex items-center group">
<!-- Inline SVG Line Icon: shield-lock -->
<div class="absolute left-3.5 text-[#9d8392] group-focus-within:text-[#ae1a64] transition-colors pointer-events-none flex items-center">

</svg>

<input class="w-full h-11 pl-10 pr-10 rounded-xl bg-[#fefafc] border border-[#e8cedb] text-[#3d2230] placeholder:text-[#9d8392] placeholder:text-[13px] text-[13px] focus:outline-none focus:border-[#fe6faa] focus:ring-2 focus:ring-[#fe6faa]/20 transition-all duration-150" id="password" maxlength="64" minlength="6" name="password" placeholder="请输入本地访问密码" required="" type="password">

<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>

</button>

<input class="w-full h-11 pl-10 pr-10 rounded-xl bg-[#fefafc] border border-[#e8cedb] text-[#3d2230] placeholder:text-[#9d8392] placeholder:text-[13px] text-[13px] focus:outline-none focus:border-[#fe6faa] focus:ring-2 focus:ring-[#fe6faa]/20 transition-all duration-150" id="confirmPassword" maxlength="64" minlength="6" name="confirmPassword" placeholder="请再次输入访问密码" required="" type="password">
<button class="absolute right-3 text-[#9d8392] hover:text-[#3d2230] transition-colors flex items-center justify-center p-1 rounded-md focus:outline-none" onclick="togglePasswordVisibility('confirmPassword', 'confirmPwdToggleIcon')" title="切换显示密码" type="button">

</div>
</main>
<script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;

      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>';
      }
    }

    function handleRegister() {
      const username = document.getElementById('username').value.trim();
      const pwd = document.getElementById('password').value;
      const confirmPwd = document.getElementById('confirmPassword').value;

      if (username.length < 3) {
        alert('账户名称长度至少为 3 个字符');
        return;
      }
      if (pwd.length < 6) {
        alert('访问密码长度至少为 6 个字符');
        return;
      }
      if (pwd !== confirmPwd) {
        alert('两次输入的密码不一致，请核对后重新输入');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = '<svg class="w-4 h-4 animate-spin text-[#4a1029]" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span>正在安全加密创建中...</span>';

      setTimeout(() => {
        btn.innerHTML = '<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"></path></svg><span class="text-white">本地账本创建成功 🌸</span>';
        btn.classList.remove('bg-[#fe6faa]', 'text-[#4a1029]');
        btn.classList.add('bg-[#1a7a42]', 'text-white');
      }, 700);
    }
  </script>
